services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
    depends_on:
      - postgres
      - redis
    networks:
      - promptops

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - promptops

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: promptops
      POSTGRES_USER: promptops
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - promptops

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - promptops

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - promptops

  vite:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    networks:
      - promptops

networks:
  promptops:

volumes:
  postgres_data:
